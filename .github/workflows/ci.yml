name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: airdesk
          POSTGRES_PASSWORD: airdesk
          POSTGRES_DB: airdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airdesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://airdesk:airdesk@localhost:5432/airdesk_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-not-for-production
          FLIGHT_PROVIDERS: mock,opensky
        run: pytest -p no:cacheprovider --cov=app --cov-report=term-missing

      - name: Deploy config validation
        run: python scripts/check_deploy.py

      - name: Alembic migration check (SQLite)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migrate.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev || npm install --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html
