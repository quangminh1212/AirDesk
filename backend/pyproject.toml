[project]
name = "airdesk-backend"
version = "0.1.0"
description = "AirDesk - AI agent platform for flight booking and logistics operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "asyncpg>=0.30.0",
    "litellm>=1.55.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.1",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "prometheus-client>=0.21.0",
    "slowapi>=0.1.9",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "respx>=0.22.0",
    "aiosqlite>=0.20.0",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# UP042 (use StrEnum) is intentionally disabled: `class X(str, enum.Enum)` is
# kept for broad runtime/SQLAlchemy compatibility. B008: FastAPI Depends idiom.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F401"]
"tests/*.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
