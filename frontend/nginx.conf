# AirDesk web UI — nginx config for the SPA container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for the JS/CSS bundles.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable, so cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or users get stale bundles after deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Proxy API calls to the FastAPI service. The trailing slash on proxy_pass
    # is intentionally omitted so /api/v1/... reaches the backend unchanged.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent turns can legitimately take a while (LLM + tool calls).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Client-side routing: any unknown path renders the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
